# Ghostfolio (fork « copilote ») pour homelab : Komodo + Pangolin
#
# Ce fichier se colle tel quel dans une stack « UI defined » de Komodo. Aucun
# fichier .env n'est lu par les conteneurs : Komodo écrit le champ Environment
# de la stack dans un fichier d'environnement à côté du compose, et Compose
# interpole les ${VAR} ci-dessous. Chaque variable de l'application est donc
# listée explicitement dans « environment: ».
#   ${VAR:?message}  : obligatoire, le déploiement échoue si elle manque
#   ${VAR:-défaut}   : optionnelle, avec une valeur par défaut sûre
# Variables à fournir : voir komodo.env.example. Guide : docs/deploy-homelab.md
#
# Aucun port n'est publié. Pangolin (agent Newt) joint le conteneur par le
# réseau Docker « web » (nom fixe : ghostfolio_web par défaut), cible
# http://ghostfolio:3333. Si Newt tourne sur une autre machine, ajoutez
# `ports: ['<ip-du-lan>:3333:3333']` au service ghostfolio (voir le guide).

name: ghostfolio

services:
  ghostfolio:
    image: ${GHOSTFOLIO_IMAGE:-ghcr.io/themlaw/ghostfolio:copilote}
    container_name: ghostfolio
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Application
      ROOT_URL: ${ROOT_URL:?ROOT_URL est obligatoire (URL publique HTTPS de l'instance, sans slash final)}
      ACCESS_TOKEN_SALT: ${ACCESS_TOKEN_SALT:?ACCESS_TOKEN_SALT est obligatoire (openssl rand -hex 32, voir print-secrets.sh)}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY est obligatoire (openssl rand -hex 32, voir print-secrets.sh)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7 days}
      # Proxy et contrôle de l'hôte
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      ENABLE_FEATURE_HOST_VALIDATION: ${ENABLE_FEATURE_HOST_VALIDATION:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ENABLE_FEATURE_RATE_LIMITING: ${ENABLE_FEATURE_RATE_LIMITING:-true}
      # Base de données et cache
      DATABASE_URL: postgresql://${POSTGRES_USER:-ghostfolio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-ghostfolio}?connect_timeout=300
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire (openssl rand -hex 32)}
      # Connexion : OIDC (Authentik) uniquement
      ENABLE_FEATURE_AUTH_OIDC: ${ENABLE_FEATURE_AUTH_OIDC:-true}
      ENABLE_FEATURE_AUTH_TOKEN: ${ENABLE_FEATURE_AUTH_TOKEN:-false}
      ENABLE_FEATURE_AUTH_GOOGLE: ${ENABLE_FEATURE_AUTH_GOOGLE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER est obligatoire (avec le slash final, ex. https://auth.example.com/application/o/ghostfolio/)}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID est obligatoire (fournisseur OAuth2 d'Authentik)}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET est obligatoire (fournisseur OAuth2 d'Authentik)}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-["openid","profile","email"]}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      OIDC_LEGACY_TOKEN_REDIRECT: ${OIDC_LEGACY_TOKEN_REDIRECT:-false}
      # Veille et serveur MCP
      ENABLE_FEATURE_REPORTS: ${ENABLE_FEATURE_REPORTS:-true}
      ENABLE_FEATURE_MCP: ${ENABLE_FEATURE_MCP:-true}
      ENABLE_FEATURE_MCP_OAUTH: ${ENABLE_FEATURE_MCP_OAUTH:-true}
      MCP_ALLOW_LEGACY_TOKENS: ${MCP_ALLOW_LEGACY_TOKENS:-false}
      # Notifications Web Push
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY est obligatoire (voir print-secrets.sh)}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY est obligatoire (voir print-secrets.sh)}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    networks:
      - backend
      - web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Requête vers localhost : acceptée par le contrôle de l'hôte pour les
      # seules routes /api/v1/health*
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      # Les migrations Prisma tournent au démarrage (entrypoint.sh)
      start_period: 90s

  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: gf-postgres
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghostfolio}
      POSTGRES_USER: ${POSTGRES_USER:-ghostfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (openssl rand -hex 32)}
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:8-alpine
    container_name: gf-redis
    restart: unless-stopped
    user: '999:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire (openssl rand -hex 32)}
    networks:
      - backend
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Base de données et cache : aucun accès à Internet ni à l'hôte
  backend:
    internal: true
  # Réseau avec sortie Internet (cours de bourse, découverte OIDC). C'est aussi
  # celui que Newt (Pangolin) rejoint ; son nom est fixe pour pouvoir le
  # déclarer « external » dans la stack de Newt.
  web:
    name: ${GHOSTFOLIO_WEB_NETWORK:-ghostfolio_web}

volumes:
  postgres:
